<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espoirdre</title>
<meta name="description" content="Espoirdre — a student learning to build with agentic AI.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23171512'/%3E%3Ctext%20x='32'%20y='45'%20font-family='Georgia,serif'%20font-size='38'%20fill='%23faf7f0'%20text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #faf7f0;
    --ink: #1a1712;
    --muted: #6f665a;
    --line: #e2dbcd;
    --chip: #ffffff;
    --accent: #9a5b34;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14120f;
      --ink: #f3eee3;
      --muted: #9d9486;
      --line: #302b24;
      --chip: #1d1a16;
      --accent: #d79a6b;
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(154, 91, 52, 0.10), transparent 60%),
      radial-gradient(700px 420px at 92% 108%, rgba(90, 120, 100, 0.09), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 34rem;
    animation: rise 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 22px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }

  h1 {
    margin: 0 0 18px;
    font-family: Georgia, "Times New Roman", "Songti SC", serif;
    font-size: clamp(2.6rem, 9vw, 3.9rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  .lede {
    margin: 0 0 34px;
    font-size: clamp(1rem, 2.6vw, 1.1rem);
    line-height: 1.75;
    color: var(--muted);
    max-width: 30rem;
  }

  .lede strong {
    color: var(--ink);
    font-weight: 600;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding-top: 26px;
    border-top: 1px solid var(--line);
  }

  .links a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--chip);
    color: var(--ink);
    font-size: 0.9rem;
    text-decoration: none;
    transition: border-color 0.18s ease, transform 0.18s ease;
  }

  .links a:hover,
  .links a:focus-visible {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .links svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
    flex: none;
  }

  footer {
    margin-top: 30px;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
</style>
</head>
<body>
  <main>
    <div class="eyebrow"><span class="dot"></span>Homepage</div>

    <h1>Espoirdre</h1>

    <p class="lede">
      A student learning to build things with <strong>agentic AI</strong>.
      Currently figuring out Git, one commit at a time.
    </p>

    <nav class="links" aria-label="Elsewhere">
      <a href="https://github.com/Espoirdre" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        GitHub
      </a>
      <a href="https://github.com/Espoirdre/Espoirdre.github.io" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2.5A1.5 1.5 0 0 1 3.5 1h6.8a1 1 0 0 1 .7.3l2.7 2.7a1 1 0 0 1 .3.7v8.8a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 14.5v-12Zm1.5 0v12h9V4.9L10.1 2.5H3.5Zm2 5.5h5v1h-5V8Zm0 2.5h5v1h-5v-1Z"/></svg>
        Source
      </a>
    </nav>

    <footer>&copy; 2026 Espoirdre</footer>
  </main>
</body>
</html>
